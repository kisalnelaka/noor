server {
    listen 80;
    server_name noor.tenancyos.com;

    # Redirect to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name noor.tenancyos.com;

    # Use the existing TenancyOS SSL certificates (assuming wildcard or shared Origin)
    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    # Optimization for Cloudflare
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # NOOR API
    location / {
        proxy_pass http://noor-backend:8000;
        proxy_http_version 1.1;
        
        # WebSocket Support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_read_timeout 86400;
    }

    # Error handling
    error_page 502 /502.html;
    location = /502.html {
        return 502 '{"error": "NOOR AI Backend is booting or offline"}';
        add_header Content-Type application/json;
    }
}
