name: noor
description: "NOOR - Premium Real Estate Intelligence Assistant"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  web_socket_channel: ^2.4.0
  record: ^6.2.0          # For voice recording
  audioplayers: ^6.4.0    # For TTS playback (also upgrading to avoid conflicts)
  google_maps_flutter: ^2.5.0
  flutter_pdfview: ^1.3.2 # For returning highlighted leases
  provider: ^6.1.1
  flutter_spinkit: ^5.2.0 # For Voice Orb animation
  http: ^1.1.0
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  vibration: ^3.1.8
  geolocator: ^11.0.1
  flutter_compass: ^0.8.0
  url_launcher: ^6.2.6
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
